version = 1
SPDX-PackageName = "NeoFOAM"
SPDX-PackageSupplier = "NeoFOAM authors"
SPDX-PackageDownloadLocation = "https://github.com/exasim-project/NeoFOAM"

[[annotations]]
path = [
    ".github/**", "AUTHORS.md",  "doc/**"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2023 NeoFOAM authors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
    "CMakePresets.json", ".clang-format", ".clang-tidy", ".pre-commit-config.yaml", "spack.yaml", "REUSE.toml",  ".vscode/**.json", "*.log", ".claude/**", "CLAUDE.md"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2023 - 2024 NeoFOAM authors"
SPDX-License-Identifier = "Unlicense"

[[annotations]]
path = [
    "test/**",
     "benchmarks/**",
     "tutorials/**",
     "examples/**",
     ".github/workflows/build.yaml",
     ".github/workflows/static_checks.yaml",
     ".github/workflows/pubkey.gpg",
     ".vscode/c_cpp_properties.json",
     ".vscode/settings.json",
     "CHANGELOG.md",
     "README.md",
     "AGENTS.md",
     "CLAUDE.md",
     ".claude/**",
     ".gitmodules",
     ".coverage",
     "environment.yml",
    "CMakePresets.json",
    ".clang-format",
    ".clang-tidy",
    ".pre-commit-config.yaml",
    "spack.yaml",
    "**/case/**",
    "verification/baseline/*.json",
    # Study output: cases/, results/, report*, .snakemake/ and __pycache__ are all
    # git-ignored, but reuse walks the filesystem rather than the index and sees them.
    "verification/**",
    "REUSE.toml",
    "ruff.toml",
    "pyproject.toml",
    "uv.lock"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2023 - 2025 NeoFOAM authors"
SPDX-License-Identifier = "Unlicense"

# The case wizard's client-side JSONForms component: JS build inputs plus the
# checked-in Vite bundle. None of these can carry a comment header (JSON, a
# lockfile, minified output), so they are annotated here instead.
[[annotations]]
path = [
    "src/neofoam/ui/jsonforms_module/.gitignore",
    "src/neofoam/ui/jsonforms_module/bun.lock",
    "src/neofoam/ui/jsonforms_module/entry.mjs",
    "src/neofoam/ui/jsonforms_module/package.json",
    "src/neofoam/ui/jsonforms_module/vite.config.mjs",
    "src/neofoam/ui/jsonforms_module/static/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 NeoFOAM authors"
SPDX-License-Identifier = "GPL-3.0-or-later"
