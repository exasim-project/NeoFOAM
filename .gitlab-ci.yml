# ============================================================
#  GPU-specific images and runner configuration
# ============================================================
# OpenFOAM v2512 + Ginkgo develop + GPU-aware MPICH, built by
# exasim-project/openfoam-conda on top of the exasim-project/ginkgo-packaging images.
# Dated tags: the runner caches SIF images by name.
.gpu-base:
  variables:
    PYTHONPATH: /opt/intel/oneapi/advisor/2025.3/pythonapi

.gpu-nvidia:
  extends: .gpu-base
  tags: ["nvidia-gpus"]
  image: ghcr.io/exasim-project/openfoam-ginkgo-cuda:2512-20261009
  variables:
    GPU_VENDOR: nvidia

.gpu-amd:
  extends: .gpu-base
  tags: ["amd-gpus"]
  image: ghcr.io/exasim-project/openfoam-ginkgo-rocm:2512-20261009
  variables:
    GPU_VENDOR: amd

.gpu-intel:
  extends: .gpu-base
  tags: ["intel-gpus"]
  image: ghcr.io/exasim-project/openfoam-ginkgo-sycl:2512-20261009
  variables:
    GPU_VENDOR: intel

# ============================================================
#  Common OpenFOAM environment setup
# ============================================================
.openfoam-env-setup:
  before_script:
    - |
        case "$GPU_VENDOR" in
          intel)
            echo "Running Intel oneAPI setup"
            source /opt/intel/oneapi/setvars.sh --force
            ;;
        esac
        echo "Running OpenFOAM environment setup"
        source /opt/openfoam/activate.sh
        echo "OpenFOAM ${WM_PROJECT_VERSION} in ${WM_PROJECT_DIR}"

# ============================================================
#  Benchmarking variables
# ============================================================
.variables-for-benchmarking:
  variables:
    RESULTS_DIR: "NeoFOAM/${PR_NUMBER}/${CI_RUNNER_DESCRIPTION}"
    RUN_IDENTIFIER: "${CI_PIPELINE_ID}"
    REPO_NAME: "NeoFOAM-BenchmarkData"
    TARGET_REPO: "github.com/exasim-project/${REPO_NAME}.git"

# ============================================================
#  Rule blocks
# ============================================================
# Triggered from NeoFOAM – testing
.rules-neofoam-testing:
  rules:
    - if: '$GPU_VENDOR == "nvidia" && $SKIP_NVIDIA != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $TRIGGER_SOURCE == "NeoFOAM" &&
           $BENCHMARK != "true"'
      when: always

    - if: '$GPU_VENDOR == "amd" && $SKIP_AMD != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $TRIGGER_SOURCE == "NeoFOAM" &&
           $BENCHMARK != "true"'
      when: always

    - if: '$GPU_VENDOR == "intel" && $SKIP_INTEL != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $TRIGGER_SOURCE == "NeoFOAM" &&
           $BENCHMARK != "true"'
      when: always
    - when: never

# Triggered from NeoFOAM – benchmarking
.rules-neofoam-benchmarking:
  rules:
    - if: '$GPU_VENDOR == "nvidia" && $SKIP_NVIDIA != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $TRIGGER_SOURCE == "NeoFOAM" &&
           $BENCHMARK == "true"'
      when: always

    - if: '$GPU_VENDOR == "amd" && $SKIP_AMD != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $TRIGGER_SOURCE == "NeoFOAM" &&
           $BENCHMARK == "true"'
      when: always

    - if: '$GPU_VENDOR == "intel" && $SKIP_INTEL != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $TRIGGER_SOURCE == "NeoFOAM" &&
           $BENCHMARK == "true"'
      when: always
    - when: never

# Triggered from NeoN – testing
.rules-neon-testing:
  rules:
    - if: '$GPU_VENDOR == "nvidia" && $SKIP_NVIDIA != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $TRIGGER_SOURCE == "NeoN" &&
           $BENCHMARK != "true"'
      when: always

    - if: '$GPU_VENDOR == "amd" && $SKIP_AMD != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $TRIGGER_SOURCE == "NeoN" &&
           $BENCHMARK != "true"'
      when: always

    - if: '$GPU_VENDOR == "intel" && $SKIP_INTEL != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $TRIGGER_SOURCE == "NeoN" &&
           $BENCHMARK != "true"'
      when: always
    - when: never

# ============================================================
#  Job templates
# ============================================================
.build-and-test:
  extends:
    - .openfoam-env-setup
  script:
    - ./ci/lrz-gitlab/build-and-test.sh

.benchmark:
  extends:
    - .openfoam-env-setup
    - .variables-for-benchmarking
  script:
    - ./ci/lrz-gitlab/benchmark.sh

# ============================================================
#  NeoFOAM - testing jobs
# ============================================================
build-test-neofoam-nvidia:
  extends:
    - .gpu-nvidia
    - .rules-neofoam-testing
    - .build-and-test

build-test-neofoam-amd:
  extends:
    - .gpu-amd
    - .rules-neofoam-testing
    - .build-and-test

build-test-neofoam-intel:
  extends:
    - .gpu-intel
    - .rules-neofoam-testing
    - .build-and-test

# ============================================================
#  NeoFOAM - benchmarking jobs
# ============================================================
benchmark-neofoam-nvidia:
  extends:
    - .gpu-nvidia
    - .rules-neofoam-benchmarking
    - .benchmark

benchmark-neofoam-amd:
  extends:
    - .gpu-amd
    - .rules-neofoam-benchmarking
    - .benchmark

benchmark-neofoam-intel:
  extends:
    - .gpu-intel
    - .rules-neofoam-benchmarking
    - .benchmark

# ============================================================
#  NeoN - testing jobs
# ============================================================
build-test-from-neon-nvidia:
  extends:
    - .gpu-nvidia
    - .rules-neon-testing
    - .build-and-test

build-test-from-neon-amd:
  extends:
    - .gpu-amd
    - .rules-neon-testing
    - .build-and-test

build-test-from-neon-intel:
  extends:
    - .gpu-intel
    - .rules-neon-testing
    - .build-and-test
