# ============================================================
#  GPU-specific images and runner configuration
# ============================================================
.gpu-base:
  variables:
    PYTHONPATH: /opt/intel/oneapi/advisor/2025.3/pythonapi
    WM_PROJECT_VERSION: v2412

.gpu-nvidia:
  extends: .gpu-base
  tags: ["nvidia-gpus"]
  image: chihtaw/cuda-openfoam-ginkgo:12.8.1-v2412-arch_89
  variables:
    FOAM_INST_DIR: /usr/local/app/openfoam
    KOKKOS_TOOLS_DIR: /usr/local/app/kokkos-tools
    GPU_VENDOR: nvidia

.gpu-amd:
  extends: .gpu-base
  tags: ["amd-gpus"]
  image: chihtaw/rocm-openfoam-ginkgo:6.4.1-v2412-arch_gfx90a
  variables:
    FOAM_INST_DIR: /workspace/openfoam
    KOKKOS_TOOLS_DIR: /workspace/kokkos-tools
    GPU_VENDOR: amd

.gpu-intel:
  extends: .gpu-base
  tags: ["intel-gpus"]
  image: dheerajraghunathan/oneapi-openfoam-ginkgo:2025.3-v2412-arch_pvc
  variables:
    FOAM_INST_DIR: /opt/openfoam
    GPU_VENDOR: intel

# ============================================================
#  Common OpenFOAM environment setup
# ============================================================
.openfoam-env-setup-nvidia-amd:
  variables:
    WM_PROJECT: OpenFOAM
    WM_OPTIONS: linux64GccDPInt32Opt
    WM_COMPILER_TYPE: system
    WM_COMPILER: Gcc
    WM_PRECISION_OPTION: DP
    WM_LABEL_SIZE: 32
    WM_COMPILE_OPTION: Opt
    WM_OSTYPE: POSIX
    WM_ARCH: linux64
    WM_ARCH_OPTION: 64
    WM_LINK_LANGUAGE: c++
    WM_LABEL_OPTION: Int32
    WM_MPLIB: SYSTEMOPENMPI
    MPI_BUFFER_SIZE: 20000000

    FOAM_ETC: "$FOAM_INST_DIR/$WM_PROJECT-$WM_PROJECT_VERSION/etc"
    FOAM_SRC: "$FOAM_INST_DIR/$WM_PROJECT-$WM_PROJECT_VERSION/src"
    FOAM_LIBBIN: "$FOAM_INST_DIR/$WM_PROJECT-$WM_PROJECT_VERSION/platforms/$WM_OPTIONS/lib"
    FOAM_APPBIN: "$FOAM_INST_DIR/$WM_PROJECT-$WM_PROJECT_VERSION/platforms/$WM_OPTIONS/bin"
    WM_PROJECT_DIR: "$FOAM_INST_DIR/$WM_PROJECT-$WM_PROJECT_VERSION"

  before_script:
    - |
        case "$GPU_VENDOR" in
          nvidia|amd)
            echo "Running AMD/NVIDIA OpenFOAM environment setup"
            export PATH="$FOAM_APPBIN:$PATH"
            export FOAM_MPI=$(basename $(dirname $(find $FOAM_LIBBIN -name libPstream.so | head -n1)))
            echo "Detected FOAM_MPI=$FOAM_MPI"
            export LD_LIBRARY_PATH="$FOAM_LIBBIN:$FOAM_LIBBIN/$FOAM_MPI:$LD_LIBRARY_PATH"
            export CMAKE_LIBRARY_PATH="$FOAM_LIBBIN:$FOAM_LIBBIN/$FOAM_MPI:$CMAKE_LIBRARY_PATH"
            export MANPATH="$FOAM_ETC/man:$MANPATH"
            ;;
        esac

    # Debugging info
    - echo "GPU_VENDOR=$GPU_VENDOR"
    - echo "PATH=$PATH"
    - echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
    - echo "CMAKE_LIBRARY_PATH=$CMAKE_LIBRARY_PATH"
    - which simpleFoam || echo "simpleFoam not found!"
    - find $FOAM_LIBBIN -name "libPstream.so"

.openfoam-env-setup-intel:
  before_script:
    - |
        case "$GPU_VENDOR" in
          intel)
            echo "Running Intel oneAPI + OpenFOAM environment setup"
            source /opt/intel/oneapi/setvars.sh --force
            eval "$(bash -c 'source /opt/openfoam/OpenFOAM-v2412/etc/bashrc >/dev/null 2>&1; export -p')"
            ;;
        esac

# ============================================================
#  Benchmarking variables
# ============================================================
.variables-for-benchmarking:
  variables:
    RESULTS_DIR: "NeoFOAM/${PR_NUMBER}/${CI_RUNNER_DESCRIPTION}"
    RUN_IDENTIFIER: "${CI_PIPELINE_ID}"
    REPO_NAME: "NeoFOAM-BenchmarkData"
    TARGET_REPO: "github.com/exasim-project/${REPO_NAME}.git"
    TARGET_BRANCH: "ci-benchmarks"
    TARGET_RESULTS_DIR: "NeoFOAM/${PR_NUMBER}/${CI_RUNNER_DESCRIPTION}"

# ============================================================
#  Rule blocks
# ============================================================
# Triggered from NeoFOAM – testing
.rules-neofoam-testing:
  rules:
    - if: '$GPU_VENDOR == "nvidia" && $SKIP_NVIDIA != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $TRIGGER_SOURCE == "NeoFOAM" &&
           $BENCHMARK != "true" && $PROFILE == "false"'
      when: always

    - if: '$GPU_VENDOR == "amd" && $SKIP_AMD != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $TRIGGER_SOURCE == "NeoFOAM" &&
           $BENCHMARK != "true" && $PROFILE == "false"'
      when: always

    - if: '$GPU_VENDOR == "intel" && $SKIP_INTEL != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $TRIGGER_SOURCE == "NeoFOAM" &&
           $BENCHMARK != "true" && $PROFILE == "false"'
      when: always
    - when: never

# Triggered from NeoFOAM – profiling
.rules-neofoam-profiling:
  rules:
    - if: '$GPU_VENDOR == "nvidia" && $SKIP_NVIDIA != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $TRIGGER_SOURCE == "NeoFOAM" &&
           $BENCHMARK != "true" && $PROFILE == "true"'
      when: always

    - if: '$GPU_VENDOR == "amd" && $SKIP_AMD != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $TRIGGER_SOURCE == "NeoFOAM" &&
           $BENCHMARK != "true" && $PROFILE == "true"'
      when: always

    - if: '$GPU_VENDOR == "intel" && $SKIP_INTEL != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $TRIGGER_SOURCE == "NeoFOAM" &&
           $BENCHMARK != "true" && $PROFILE == "true"'
      when: always
    - when: never

# Triggered from NeoFOAM – benchmarking
.rules-neofoam-benchmarking:
  rules:
    - if: '$GPU_VENDOR == "nvidia" && $SKIP_NVIDIA != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $TRIGGER_SOURCE == "NeoFOAM" &&
           $BENCHMARK == "true" && $PROFILE == "false"'
      when: always

    - if: '$GPU_VENDOR == "amd" && $SKIP_AMD != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $TRIGGER_SOURCE == "NeoFOAM" &&
           $BENCHMARK == "true" && $PROFILE == "false"'
      when: always

    - if: '$GPU_VENDOR == "intel" && $SKIP_INTEL != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $TRIGGER_SOURCE == "NeoFOAM" &&
           $BENCHMARK == "true" && $PROFILE == "false"'
      when: always
    - when: never

# Triggered from NeoN – testing
.rules-neon-testing:
  rules:
    - if: '$GPU_VENDOR == "nvidia" && $SKIP_NVIDIA != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $TRIGGER_SOURCE == "NeoN" &&
           $BENCHMARK != "true"'
      when: always

    - if: '$GPU_VENDOR == "amd" && $SKIP_AMD != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $TRIGGER_SOURCE == "NeoN" &&
           $BENCHMARK != "true"'
      when: always

    - if: '$GPU_VENDOR == "intel" && $SKIP_INTEL != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $TRIGGER_SOURCE == "NeoN" &&
           $BENCHMARK != "true"'
      when: always
    - when: never

# ============================================================
#  Job templates
# ============================================================
.build-and-test:
  script:
    - ./ci/lrz-gitlab/build-and-test.sh

.profile:
  script:
    - ./ci/lrz-gitlab/profile.sh

.benchmark:
  extends:
    - .variables-for-benchmarking
  script:
    - ./ci/lrz-gitlab/benchmark.sh

# ============================================================
#  NeoFOAM - testing jobs
# ============================================================
build-test-neofoam-nvidia:
  extends:
    - .gpu-nvidia
    - .rules-neofoam-testing
    - .openfoam-env-setup-nvidia-amd
    - .build-and-test

build-test-neofoam-amd:
  extends:
