    - .benchmark

benchmark-neofoam-intel:
  extends:
    - .gpu-intel
    - .rules-neofoam-benchmarking
    - .openfoam-env-setup-intel
    - .benchmark

# ============================================================
#  NeoN - testing jobs
# ============================================================
build-test-from-neon-nvidia:
  extends:
    - .gpu-nvidia
    - .rules-neon-testing
    - .openfoam-env-setup-nvidia-amd
