# ============================================================
#  GPU-specific images and runner configuration
# ============================================================
.gpu-base:
  variables:
    PYTHONPATH: /opt/intel/oneapi/advisor/2025.3/pythonapi
    WM_PROJECT_VERSION: v2412

.gpu-nvidia:
  extends: .gpu-base
  tags: ["nvidia-gpus"]
  image: chihtaw/cuda-openfoam-ginkgo:12.8.1-v2412-arch_89
  variables:
    FOAM_INST_DIR: /usr/local/app/openfoam
    GPU_VENDOR: nvidia

.gpu-amd:
  extends: .gpu-base
  tags: ["amd-gpus"]
  image: chihtaw/rocm-openfoam-ginkgo:6.4.1-v2412-arch_gfx90a
  variables:
    FOAM_INST_DIR: /workspace/openfoam
    GPU_VENDOR: amd

.gpu-intel:
  extends: .gpu-base
  tags: ["intel-gpus"]
  image: dheerajraghunathan/oneapi-openfoam-ginkgo:2025.3-v2412-arch_pvc
  variables:
    FOAM_INST_DIR: /opt/openfoam
    GPU_VENDOR: intel

# ============================================================
#  Common OpenFOAM environment setup
# ============================================================
.openfoam-env-setup:
  before_script:
    - |
        case "$GPU_VENDOR" in
          intel)
            echo "Running Intel oneAPI setup"
            source /opt/intel/oneapi/setvars.sh --force
            ;;
        esac
        echo "Running OpenFOAM environment setup"
        eval "$(bash -c 'source $FOAM_INST_DIR/OpenFOAM-v2412/etc/bashrc >/dev/null 2>&1; export -p')"

# ============================================================
#  Benchmarking variables
# ============================================================
.variables-for-benchmarking:
  variables:
    RESULTS_DIR: "NeoFOAM/${PR_NUMBER}/${CI_RUNNER_DESCRIPTION}"
    RUN_IDENTIFIER: "${CI_PIPELINE_ID}"
    REPO_NAME: "NeoFOAM-BenchmarkData"
    TARGET_REPO: "github.com/exasim-project/${REPO_NAME}.git"

# ============================================================
#  Rule blocks
# ============================================================
# Triggered from NeoFOAM – testing
.rules-neofoam-testing:
  rules:
    - if: '$GPU_VENDOR == "nvidia" && $SKIP_NVIDIA != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $TRIGGER_SOURCE == "NeoFOAM" &&
           $BENCHMARK != "true"'
      when: always

    - if: '$GPU_VENDOR == "amd" && $SKIP_AMD != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $TRIGGER_SOURCE == "NeoFOAM" &&
           $BENCHMARK != "true"'
      when: always

    - if: '$GPU_VENDOR == "intel" && $SKIP_INTEL != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $TRIGGER_SOURCE == "NeoFOAM" &&
           $BENCHMARK != "true"'
      when: always
    - when: never

# Triggered from NeoFOAM – benchmarking
.rules-neofoam-benchmarking:
  rules:
    - if: '$GPU_VENDOR == "nvidia" && $SKIP_NVIDIA != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $TRIGGER_SOURCE == "NeoFOAM" &&
           $BENCHMARK == "true"'
      when: always

    - if: '$GPU_VENDOR == "amd" && $SKIP_AMD != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $TRIGGER_SOURCE == "NeoFOAM" &&
           $BENCHMARK == "true"'
      when: always

    - if: '$GPU_VENDOR == "intel" && $SKIP_INTEL != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $TRIGGER_SOURCE == "NeoFOAM" &&
           $BENCHMARK == "true"'
      when: always
    - when: never

# Triggered from NeoN – testing
.rules-neon-testing:
  rules:
    - if: '$GPU_VENDOR == "nvidia" && $SKIP_NVIDIA != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $TRIGGER_SOURCE == "NeoN" &&
           $BENCHMARK != "true"'
      when: always

    - if: '$GPU_VENDOR == "amd" && $SKIP_AMD != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $TRIGGER_SOURCE == "NeoN" &&
           $BENCHMARK != "true"'
      when: always

    - if: '$GPU_VENDOR == "intel" && $SKIP_INTEL != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $TRIGGER_SOURCE == "NeoN" &&
           $BENCHMARK != "true"'
      when: always
    - when: never

# ============================================================
#  Job templates
# ============================================================
.build-and-test:
  extends:
    - .openfoam-env-setup
  script:
    - ./ci/lrz-gitlab/build-and-test.sh

.benchmark:
  extends:
    - .openfoam-env-setup
    - .variables-for-benchmarking
  script:
    - ./ci/lrz-gitlab/benchmark.sh

# ============================================================
#  NeoFOAM - testing jobs
# ============================================================
build-test-neofoam-nvidia:
  extends:
    - .gpu-nvidia
    - .rules-neofoam-testing
    - .build-and-test

build-test-neofoam-amd:
  extends:
    - .gpu-amd
    - .rules-neofoam-testing
    - .build-and-test

build-test-neofoam-intel:
  extends:
    - .gpu-intel
    - .rules-neofoam-testing
    - .build-and-test

# ============================================================
#  NeoFOAM - benchmarking jobs
# ============================================================
benchmark-neofoam-nvidia:
  extends:
    - .gpu-nvidia
    - .rules-neofoam-benchmarking
    - .benchmark

benchmark-neofoam-amd:
  extends:
    - .gpu-amd
    - .rules-neofoam-benchmarking
    - .benchmark

benchmark-neofoam-intel:
  extends:
    - .gpu-intel
    - .rules-neofoam-benchmarking
    - .benchmark

# ============================================================
#  NeoN - testing jobs
# ============================================================
build-test-from-neon-nvidia:
  extends:
    - .gpu-nvidia
    - .rules-neon-testing
    - .build-and-test

build-test-from-neon-amd:
  extends:
    - .gpu-amd
    - .rules-neon-testing
    - .build-and-test

build-test-from-neon-intel:
  extends:
    - .gpu-intel
    - .rules-neon-testing
    - .build-and-test
