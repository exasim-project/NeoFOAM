repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: pretty-format-json
        args: [--autofix, --no-sort-keys]
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: 'v17.0.6'  # The default in Ubuntu 22.04, which is used in our CI
    hooks:
      - id: clang-format
        types_or: [c++]
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
      - id: cmake-lint
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
  - repo: https://github.com/crate-ci/typos
    rev: v1.23.1
    hooks:
      - id: typos

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff-format
        exclude: \.cmake-format\.py$
      - id: ruff
        args: [--fix]
        exclude: \.cmake-format\.py$

  - repo: local
    hooks:
      # mypy needs project dependencies (pydantic plugin, etc.),
      # so it must run in the project venv. --frozen skips uv sync/rebuild.
      - id: type-check
        name: Mypy Type Check
        entry: mypy
        language: system
        pass_filenames: false
