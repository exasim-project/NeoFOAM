# Dirichlet-Neumann at the plate's top (see the coupled entries of 0/T),
# 161 against 100 faces. The node wraps the fluid's PIMPLE loop: T drives the
# flow, so each pass repeats it. Without relaxation the passes diverge.
exchanges:
  - name: interface
    sides: {fluid: interface, solid: top}
    mapping: nearest-neighbor
couplings:
  - name: cht
    scheme: serial
    maxIterations: 30
    exchanges:
      - {name: interface, acceleration: {type: aitken, relaxation: 0.1}}
    convergence:
      - {type: relative, data: T, limit: 1.0e-5}
    wraps:
      fluid: {operations: [inner_loop]}
      solid: {operations: [solve_T]}
