name: Mirror to LRZ GitLab (main, develop)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:  # manually triggered

env:
  LRZ_GROUP: greole
  LRZ_HOST: gitlab-ce.lrz.de
  REPO_NAME: ${{ github.event.repository.name }}
  LRZ_GITLAB_PROJECT_TOKEN: ${{ secrets.GITLAB_PROJECT_TOKEN }}

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # fetch full history

      - name: Fetch main and develop branches
        run: |
          # Ensure the branches exist locally
          git fetch origin main:main || echo "main branch not found in origin"
          git fetch origin develop:develop || echo "develop branch not found in origin"

      - name: Mirror selected branches to LRZ GitLab
        run: |
          set -e
          echo "Configuring LRZ remote..."
          LRZ_PROJECT_PATH="${LRZ_GROUP}/${REPO_NAME}"
          git remote add lrz https://oauth2:${LRZ_GITLAB_PROJECT_TOKEN}@${LRZ_HOST}/${LRZ_PROJECT_PATH}.git

          # Branches to mirror
          BRANCHES=("main" "develop")

          for branch in "${BRANCHES[@]}"; do
            if git show-ref --verify --quiet refs/heads/$branch; then
              echo "Pushing branch '$branch' to LRZ GitLab..."
              git push lrz $branch:$branch
            else
              echo "Branch '$branch' does not exist locally, skipping..."
            fi
          done

          echo "Branch mirror completed successfully."
