name: Build NeoFOAM
run-name: 'Build NeoFOAM'

on:
  push:
    branches: [develop, main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: '00 8 * * 0'
  workflow_dispatch:

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  OMPI_MCA_rmaps_base_oversubscribe: 1

concurrency:
  group: >
    ${{ github.workflow }}-
    ${{ github.event_name }}-
    ${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-neofoam:
    name: >
      Build and test ${{ github.event.repository.name }}
      on CPU (${{ matrix.compiler.CC }})
    runs-on: ubuntu-24.04
    if: >
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'skip-build')
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - CC: clang
            CXX: clang++
          - CC: gcc
            CXX: g++
    steps:
      - name: Determine branch
        run: |

          # Detect current branch of NeoFOAM
          NEOFOAM_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          echo "Using NeoFOAM branch: $NEOFOAM_BRANCH"
          echo "NEOFOAM_BRANCH=$NEOFOAM_BRANCH" >> $GITHUB_ENV

          # Define remote repo
          NEON_REPO="exasim-project/NeoN"
          REPO_URL="https://github.com/${NEON_REPO}"

          # Prefer a NeoN branch with the same name as this NeoFOAM branch (coordinated
          # PRs), but only while it still has commits that are NOT yet in develop. A
          # same-named branch already merged into / contained in develop is stale and
          # would build against an outdated NeoN API, so fall back to develop then.
          NEON_BRANCH="develop"
          echo "Checking if branch '$NEOFOAM_BRANCH' exists in NeoN..."
          if git ls-remote --exit-code --heads "$REPO_URL" "refs/heads/${NEOFOAM_BRANCH}" >/dev/null 2>&1; then
            echo "NeoN branch exists; checking whether it is already merged into develop..."
            # compare develop...<branch>: 'behind'/'identical' => branch fully contained in develop
            NEON_STATUS=$(curl -s "https://api.github.com/repos/${NEON_REPO}/compare/develop...${NEOFOAM_BRANCH}" | jq -r '.status // empty' || echo "")
            echo "compare(develop...${NEOFOAM_BRANCH}) status: ${NEON_STATUS:-<unknown>}"
            if [ "$NEON_STATUS" = "behind" ] || [ "$NEON_STATUS" = "identical" ]; then
              echo "NeoN branch is already merged into develop. Falling back to 'develop'."
            else
              echo "NeoN branch has unmerged commits (or status unknown). Using it: $NEOFOAM_BRANCH"
              NEON_BRANCH="$NEOFOAM_BRANCH"
            fi
          else
            echo "NeoN branch '$NEOFOAM_BRANCH' does not exist. Falling back to 'develop'."
          fi

          echo "Resolved NeoN ref: $NEON_BRANCH"
          echo "NEON_BRANCH=$NEON_BRANCH" >> $GITHUB_ENV

      - name: Checkout NeoFOAM
        uses: actions/checkout@v4
        with:
          repository: exasim-project/NeoFOAM
          ref: ${{ env.NEOFOAM_BRANCH }}
          fetch-depth: 1

      - name: Set up OpenFOAM
        uses: gerlero/setup-openfoam@v1
        with:
          openfoam-version: 2406

      - name: Install dependencies
        uses: gerlero/apt-install@v1
        with:
          packages: >-
            ninja-build
            clang-19
            libomp-19-dev
            python3
            python3-dev
            build-essential
            libopenmpi-dev
            openmpi-bin

      - name: Get versions
        run: |
          clang --version
          ninja --version
          cmake --version

      - name: Install python dependencies
        run:  pip install foamlib pandas pydantic defusedxml

      - name: Build NeoFOAM
        run: |
          source /usr/lib/openfoam/openfoam2406/etc/bashrc || true
          cmake --preset develop \
            -DNeoN_DEVEL_TOOLS=OFF \
            -DNeoN_BUILD_TESTS=OFF \
            -DNEOFOAM_WITH_MPI=ON \
            -DCMAKE_CXX_COMPILER=${{matrix.compiler.CXX}} \
            -DCMAKE_C_COMPILER=${{matrix.compiler.CC}} \
            -DNeoN_ENABLE_MPI_WITH_THREAD_SUPPORT=OFF \
            -DNEOFOAM_NEON_VERSION=${{ env.NEON_BRANCH }} \
            -DNEOFOAM_BUILD_BENCHMARKS=ON
          cmake --build --preset develop

      - name: Execute unit tests of NeoFOAM
        run: |
          source /usr/lib/openfoam/openfoam2406/etc/bashrc || true
          ctest --preset develop -E bench --output-on-failure

  build-python:
    runs-on: ubuntu-latest # may use an older version to test
    if: "!contains(toJson(github.event.pull_request.labels.*.name), 'Skip-build')"
    strategy:
      matrix:
        openfoam-version: [ 2506] # 2406, 2412,
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false
    name: neofoam Python with OpenFOAM ${{ matrix.openfoam-version }}
    steps:
      # submodules, so that src/NeoN is a real checkout: this job is the only one
      # that runs NeoN's blockAMR tests (see the MPI step below) and they live in
      # the submodule. Not a change of NeoN version -- without a checkout CPM
      # fetches the very same submodule SHA (cmake/CxxThirdParty.cmake reads it
      # with `git submodule status`), so this only swaps a GitHub fetch for the
      # local tree.
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up OpenFOAM
        uses: gerlero/setup-openfoam@v1
        with:
          openfoam-version: ${{ matrix.openfoam-version }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # mpirun for the blockAMR MPI step below. NEOFOAM_WITH_MPI is ON by default
      # and this job already builds, so MPI is present via OpenFOAM -- declaring it
      # here makes the MPI step's requirement explicit rather than inherited.
      - name: Install MPI
        run: |
          sudo apt update
          sudo apt install -y libopenmpi-dev openmpi-bin

      - name: Install test dependencies
        run: |
          pip install .[all] -v

      - name: Test with pytest
        run: |
          pytest

      # NeoN's blockAMR tests that need more than one rank. They are written to be
      # correct on any rank count and to skip themselves on one, so a normal pytest
      # run says nothing about them -- they were green for months while the native
      # GMG residual norm was rank-local. This is the only lane that exercises them:
      # NeoN's own workflows build no AMReX, and this job already pays for the
      # AMReX+Ginkgo build that `pip install .[all]` does.
      #
      # Only the tests marked `mpi`. The rest of the suite under mpirun would run in
      # full on every rank against a different box distribution, which is neither
      # what those tests assert nor a decomposition they were written for.
      #
      # The grep is not belt-and-braces: because these tests skip themselves on one
      # rank, a lane where they ALL skip is green and says nothing -- exactly the
      # state this step exists to end. `cuda` skips here (no GPU) and everything
      # skips if blockamr was built without Ginkgo; the `reference` cases must run.
      - name: Test blockAMR on 2 MPI ranks
        env:
          # These only matter on a runner with fewer cores than ranks. Both
          # spellings: OpenMPI 5 dropped the first.
          OMPI_MCA_rmaps_base_oversubscribe: 1
          OMPI_MCA_rmaps_default_mapping_policy: ":oversubscribe"
        run: |
          mpirun -n 2 python -m pytest src/NeoN/test/blockamr -m mpi -v -rs | tee log
          grep -qE '[0-9]+ passed' log || { echo "lane ran vacuously"; exit 1; }

  python-coverage:
    runs-on: ubuntu-24.04 # may use an older version to test

    name: Test coverage with OpenFOAM 2506 and Python 3.10
    steps:
      - uses: actions/checkout@v5

      - name: Set up OpenFOAM
        uses: gerlero/setup-openfoam@v1
        with:
          openfoam-version: 2506

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: |
          pip install -v .[all]

      - name: Test with pytest
        run: |
          pytest --cov=neofoam --cov-report=xml --cov-report=term

      # - name: Upload code coverage results to Codecov
      #   uses: codecov/codecov-action@v5
      #   with:
      #     files: ./coverage.xml
      #     token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up OpenFOAM
      uses: gerlero/setup-openfoam@v1
      with:
        openfoam-version: 2506

    - name: Lint with Ruff
      uses: astral-sh/ruff-action@v3

    - name: Format with Ruff
      uses: astral-sh/ruff-action@v3
      with:
        args: 'format --check'

  typing:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up OpenFOAM
      uses: gerlero/setup-openfoam@v1
      with:
        openfoam-version: 2506

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Check types with ty
      run: |
        pip install .[all]
        poe type_check
