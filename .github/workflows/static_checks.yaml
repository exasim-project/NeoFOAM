name: Static checks
run-name: Static checks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: >
    ${{ github.workflow }}-
    ${{ github.event_name }}-
    ${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-compilation-db:
    if: >
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'skip-build')
    name: Build with IWYU
    runs-on: ubuntu-24.04
    steps:
    - name: Determine branch
      run: |

          # Detect current branch of NeoFOAM
          NEOFOAM_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          echo "Using NeoFOAM branch: $NEOFOAM_BRANCH"
          echo "NEOFOAM_BRANCH=$NEOFOAM_BRANCH" >> $GITHUB_ENV

          # Define remote repo
          NEON_REPO="exasim-project/NeoN"
          REPO_URL="https://github.com/${NEON_REPO}"

          # Prefer a NeoN branch with the same name as this NeoFOAM branch (coordinated
          # PRs), but only while it still has commits that are NOT yet in develop. A
          # same-named branch already merged into / contained in develop is stale and
          # would build against an outdated NeoN API, so fall back to develop then.
          NEON_BRANCH="develop"
          echo "Checking if branch '$NEOFOAM_BRANCH' exists in NeoN..."
          if git ls-remote --exit-code --heads "$REPO_URL" "refs/heads/${NEOFOAM_BRANCH}" >/dev/null 2>&1; then
            echo "NeoN branch exists; checking whether it is already merged into develop..."
            # compare develop...<branch>: 'behind'/'identical' => branch fully contained in develop
            NEON_STATUS=$(curl -s "https://api.github.com/repos/${NEON_REPO}/compare/develop...${NEOFOAM_BRANCH}" | jq -r '.status // empty' || echo "")
            echo "compare(develop...${NEOFOAM_BRANCH}) status: ${NEON_STATUS:-<unknown>}"
            if [ "$NEON_STATUS" = "behind" ] || [ "$NEON_STATUS" = "identical" ]; then
              echo "NeoN branch is already merged into develop. Falling back to 'develop'."
            else
              echo "NeoN branch has unmerged commits (or status unknown). Using it: $NEOFOAM_BRANCH"
              NEON_BRANCH="$NEOFOAM_BRANCH"
            fi
          else
            echo "NeoN branch '$NEOFOAM_BRANCH' does not exist. Falling back to 'develop'."
          fi

          echo "Resolved NeoN ref: $NEON_BRANCH"
          echo "NEON_BRANCH=$NEON_BRANCH" >> $GITHUB_ENV
    - uses: actions/checkout@v4

    - name: Add repos
      run: |
        sudo add-apt-repository 'deb https://dl.openfoam.com/repos/deb noble main'
        sudo apt-key add .github/workflows/pubkey.gpg

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install \
           ninja-build \
           iwyu \
           clang-16 \
           libomp-16-dev \
           libopenmpi-dev \
           openmpi-bin \
           openfoam2406-dev


    - name: Create Compilation Database
      run: |
        source /usr/lib/openfoam/openfoam2406/etc/bashrc || true
        CC=clang \
        CXX=clang++ \
        cmake --preset develop \
          -DNEOFOAM_DEVEL_TOOLS=OFF \
          -DNEOFOAM_BUILD_BENCHMARKS=OFF \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DNEOFOAM_ENABLE_MPI_WITH_THREAD_SUPPORT=OFF \
          -DNEOFOAM_NEON_VERSION=${{ env.NEON_BRANCH }} \
          -DNEOFOAM_ENABLE_IWYU=ON
        cmake --build --preset develop
    - uses: actions/upload-artifact@v4
      with:
        name: build-artifact
        path: build
  clang-tidy-check:
    name: Clang-tidy Check
    runs-on: ubuntu-24.04
    needs: [build-compilation-db]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true # Recursively clone submodules

    - name: Add repos
      run: |
        sudo add-apt-repository 'deb https://dl.openfoam.com/repos/deb noble main'
        sudo apt-key add .github/workflows/pubkey.gpg

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install \
           clang-tidy-16 \
           libomp-16-dev \
           libopenmpi-dev \
           openmpi-bin \
           openfoam2406-dev

    - uses: actions/download-artifact@v4
      with:
        name: build-artifact
        path: build

    - name: Run clang-tidy
      run: |
        # Create list of .cpp files belonging to this repository
        git ls-files | grep -E "\.(cpp)" > pattern
        # Create list of .cpp files that are in this repository and part of the
        # compilation database
        # also filters out " at the begin and end of the filename
        jq ".[] | .file" build/develop/compile_commands.json \
          | sed 's/^"\(.*\)"$/\1/' \
          | grep -F -f pattern - > files
        # run clang-tidy on all specified files
        grep -v "examples/" files > files_wo_examples
        run-clang-tidy-16 -fix -extra-arg=-w -p build/develop -j $(nproc) \
          -header-filter='.*/include/NeoFOAM/.*' \
          $(cat files_wo_examples)

    - name: Check for fixes
      run: |
        if [[ $(git ls-files -m | wc -l) -eq 0 ]]; then
          exit 0
        fi
        echo "There are fixes available from clang-tidy."
        echo "Please use your local clang-tidy or apply the following patch:"
        git diff -p
        exit 1
  pre-commit-run:
    name: Pre-commit run
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true # Recursively clone submodules

    - name: Set up OpenFOAM
      uses: gerlero/setup-openfoam@v1
      with:
        openfoam-version: 2506


    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Install Python dependencies
      run: |
        pip install .[all] -v

    - name: Run pre-commit on all files
      run: pre-commit run --all --color always --verbose
    - name: check for todo fixme note
      run: |
        NTODOS="$(grep -r 'TODO DONT MERGE' --exclude-dir=.github | wc -l)"
        echo "Found $NTODOS TODO DONT MERGE notes"
        ! grep -q -r "TODO DONT MERGE" --exclude-dir=.github
