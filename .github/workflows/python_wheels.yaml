name: Python wheels

# Builds one CPU wheel per supported Python on a runner with OpenFOAM installed.
#
# Why not cibuildwheel: it builds Linux wheels inside a clean manylinux container,
# which has no OpenFOAM, so the top-level configure stops at CMakeLists.txt:12-14
# ("You must source OpenFOAM before building NeoFOAM"). Putting OpenFOAM in that
# container is not a small step either — ESI publishes Debian/Ubuntu packages only
# (dl.openfoam.com/repos/deb), while every stock manylinux image is AlmaLinux or
# CentOS, so it would mean building OpenFOAM from source into a custom image.
# There is also no way to opt out of the container: cibuildwheel accepts only
# "docker" or "podman" as its container engine.
#
# CONSEQUENCE, and it is deliberate: these wheels are tagged linux_x86_64, not
# manylinux_x86_64, because they are built against this runner's glibc and link
# OpenFOAM/MPI from FOAM_LIBBIN without bundling them. `pip install ./wheel` accepts
# that locally; PyPI does NOT accept it on upload. They are CI artifacts, installable
# by anyone who has OpenFOAM 2506 sourced — which is every current NeoFOAM user.
# Publishing, dependency bundling and GPU wheels remain out of scope, as in #412.
#
# Whether a publishable manylinux wheel is reachable at all hinges on one unanswered
# question: can a manylinux-toolchain build bind at run time against a distro-built
# OpenFOAM and pybFoam? Until that is answered, a manylinux image is a speculative
# investment. See the ABI probe on branch ci/abi-probe.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-cpu-wheels:
    name: CPU wheel Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Exports FOAM_*/WM_* into $GITHUB_ENV, so every later step in this job is
      # configured. 2506 matches build-python.yaml and static_checks.yaml.
      - name: Set up OpenFOAM
        uses: gerlero/setup-openfoam@v1
        with:
          openfoam-version: 2506

      # One interpreter per job, and it is the one the wheel is built for.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # --no-deps: build the neofoam wheel only, not wheels for its dependencies.
      # Build isolation stays on, so scikit-build-core and the pinned
      # nanobind>=3.0.1,<3.1 come from [build-system] requires.
      - name: Build wheel
        run: pip wheel . --no-deps --wheel-dir wheelhouse -v

      # --no-deps is the assertion: pybFoam is built into this wheel as a top-level
      # package, not pulled from PyPI, so the bindings must find libnanobind.so via
      # their $ORIGIN/../pybFoam rpath inside the wheel itself. If pybFoam were
      # missing or misplaced, installing dependencies would mask it by fetching the
      # sdist and compiling a second, ABI-unrelated copy.
      - name: Smoke-test the wheel
        run: |
          pip install --no-deps wheelhouse/*.whl
          pip install numpy foamlib pydantic pyyaml  # runtime imports of neofoam/__init__
          cd "$RUNNER_TEMP"  # import the installed package, not the source tree
          python - <<'PY'
          import pybFoam  # bundled in this wheel, not installed from PyPI
          import neofoam

          # src/neofoam/__init__.py deliberately swallows ModuleNotFoundError and
          # leaves this None when the native stack is simply not built, so importing
          # the package alone would pass on a wheel with no extension module at all.
          assert neofoam.neofoam_bindings is not None, (
              "native bindings missing: __init__ swallowed the ModuleNotFoundError"
          )

          import neofoam.neofoam_bindings as nb

          print("NeoFOAM wheel import test passed:", nb.__file__)
          PY

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpu-wheels-${{ matrix.python-version }}
          path: wheelhouse/*.whl
          # A build that produces no wheel must fail the job, not upload an empty
          # artifact with only a warning.
          if-no-files-found: error
