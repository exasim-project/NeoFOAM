name: Build documentation

env:
  PR_NUMBER: ${{ github.event.number }}

# PR previews are built by the Python job of ci.yaml, which reuses its build of the package. This
# workflow deploys the docs of merged PRs (develop, main) and of release tags.
on:
  pull_request:
    types: [closed]

  push:
    tags:
      - v*

jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.merged
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: System packages
      run: sudo apt-get update && sudo apt-get install -y doxygen texlive-font-utils

    - name: Set up OpenFOAM
      uses: gerlero/setup-openfoam@v1
      with:
        openfoam-version: 2412

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - uses: pyvista/setup-headless-display-action@v3

    - name: Install project + docs extras
      run: |
        python -m pip install --upgrade pip
        pip install ".[docs]"

    - name: Build docs
      run: |
        sphinx-build -b html ./doc ./docs_build/
        cp -r doc/_build/ docs_build/doxygen
        touch ./docs_build/.nojekyll

    # 1. VERSIONED BUILD (tags)
    - name: Deploy Versioned Build
      if: ${{ github.ref_type == 'tag' }}
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: docs_build
        target-folder: ${{ github.ref_name }}

    # 2. DEPLOY FOR MAIN (stable)
    - name: Deploy Main
      if: >
        github.event.pull_request.merged &&
        github.event.pull_request.base.ref == 'main'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: docs_build
        target-folder: main

    # 3. DEPLOY FOR DEVELOP (dev preview)
    - name: Deploy Develop
      if: >
        github.event.pull_request.merged &&
        github.event.pull_request.base.ref == 'develop'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: docs_build
        target-folder: develop
