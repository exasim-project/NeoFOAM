name: Conda packages

# Builds the neofoam conda package with rattler-build and publishes it to a prefix.dev
# channel, so that `pixi add neofoam -c https://prefix.dev/<channel>` resolves a release.
#
# Requires two repository settings:
#   vars.PREFIX_DEV_CHANNEL     the prefix.dev channel name, e.g. exasim-project
#   secrets.PREFIX_DEV_API_KEY  an API key with write access to that channel
#
# Ported from src/NeoN/.github/workflows/conda_packages.yaml. NeoN's CUDA and ROCm jobs and its
# macOS/aarch64 matrix entries are dropped: conda-forge builds `openfoam` for linux-64 only.
#
# Note this cannot go to conda-forge. CPM clones NeoN, Kokkos, Ginkgo, Umpire and pybFoam from
# GitHub during the build, which conda-forge's offline build policy forbids. NeoN hit the same
# wall and publishes to its own channel for the same reason.

on:
  push:
    tags:
      # PR #411's release.sh tags PEP 440 versions, e.g. v0.3.0rc1, which this matches.
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built packages to prefix.dev"
        required: false
        default: false
        type: boolean
      channel:
        description: "Override the prefix.dev channel to publish to"
        required: false
        default: ""
        type: string
      version:
        description: >
          Override the package version. Use a throwaway value such as 0.0.0.dev1 to rehearse
          publishing: a conda version cannot be re-uploaded, so testing with a real release
          number burns it permanently.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  RATTLER_BUILD_VERSION: "0.75.0"

jobs:
  version:
    name: Resolve package version
    runs-on: ubuntu-latest
    if: github.repository == 'exasim-project/NeoFOAM'
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: resolve
        shell: bash
        # The dispatch input reaches bash through the environment rather than ${{ }}
        # interpolation, which would splice attacker-controlled text into the script.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "${INPUT_VERSION:-}" ]]; then
            version="${INPUT_VERSION}"
            source="workflow_dispatch input"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # v0.3.0rc1 -> 0.3.0rc1. The tag is authoritative for a release: pyproject.toml
            # may not have been stamped on the commit the tag points at.
            version="${GITHUB_REF_NAME#v}"
            source="tag ${GITHUB_REF_NAME}"
          elif [[ -f scripts/set_package_version.py ]]; then
            version="$(python3 scripts/set_package_version.py --print)"
            source="scripts/set_package_version.py"
          else
            version="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
            source="pyproject.toml"
          fi

          echo "Resolved version ${version} from ${source}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build-cpu:
    name: CPU ${{ matrix.python }} ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.platform == 'osx-arm64' && 'macos-14' || 'ubuntu-latest' }}
    if: github.repository == 'exasim-project/NeoFOAM'
    strategy:
      fail-fast: false
      matrix:
        # Mirrors the wheel matrix. No 3.9: conda-forge has no nanobind for it.
        python: ["3.10", "3.11", "3.12", "3.13"]
        # The platforms openfoam is published for in greole/exasim-project.
        platform: [linux-64, osx-arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install rattler-build
        run: |
          ci/install_rattler_build.sh "${RATTLER_BUILD_VERSION}" "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      # The build compiles NeoFOAM, NeoN, Kokkos, Ginkgo, Umpire and pybFoam in one go, which
      # needs considerably more disk than a stock runner leaves free.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      # The conda clang toolchain needs an SDK to compile against; GitHub runners ship one with
      # Xcode rather than as a conda package.
      - name: Point the conda toolchain at the macOS SDK
        if: runner.os == 'macOS'
        run: echo "CONDA_BUILD_SYSROOT=$(xcrun --show-sdk-path)" >> "${GITHUB_ENV}"

      - name: Build conda package
        env:
          NEOFOAM_VERSION: ${{ needs.version.outputs.version }}
        run: |
          ci/build_conda_packages.sh \
            --python "${{ matrix.python }}" \
            --target-platform "${{ matrix.platform }}" \
            --output-dir output

      - name: Upload conda package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: conda-cpu-${{ matrix.platform }}-py${{ matrix.python }}
          path: output/**/*.conda
          if-no-files-found: error

  publish:
    name: Publish to prefix.dev
    needs: build-cpu
    if: >
      github.repository == 'exasim-project/NeoFOAM' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    environment:
      name: prefix-dev
      url: https://prefix.dev/channels/${{ inputs.channel || vars.PREFIX_DEV_CHANNEL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install rattler-build
        run: |
          ci/install_rattler_build.sh "${RATTLER_BUILD_VERSION}" "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Download conda package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: conda-*
          path: packages
          merge-multiple: true

      - name: List packages selected for publishing
        run: find packages -type f -name "*.conda" -print -exec ls -lh {} \;

      - name: Publish to prefix.dev
        env:
          PREFIX_API_KEY: ${{ secrets.PREFIX_DEV_API_KEY }}
          PREFIX_CHANNEL: ${{ inputs.channel || vars.PREFIX_DEV_CHANNEL }}
        run: |
          if [[ -z "${PREFIX_CHANNEL}" ]]; then
            echo "No prefix.dev channel configured."
            echo "Set the PREFIX_DEV_CHANNEL repository variable or pass the channel input."
            exit 1
          fi

          mapfile -t packages < <(find packages -type f -name "*.conda" | sort)
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "No .conda packages were downloaded, nothing to publish."
            exit 1
          fi

          # No --skip-existing: it turns an already-published name-version-build into a
          # silent no-op, so a release that uploads nothing still reports success. Let the
          # upload fail loudly instead; a repeat run means the version was already burned.
          rattler-build upload prefix --channel "${PREFIX_CHANNEL}" "${packages[@]}"
