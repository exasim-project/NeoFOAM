[files]
extend-exclude = ["third_party/*", "doc/Doxyfile.in"]

[default]
extend-ignore-identifiers-re = ["nuTilda"]

[default.extend-words]
nd = "nd"
ot = "OT"
PRECICE = "PRECICE"
# German "oder" appears verbatim in a translated Linux error message
# shown in doc/how-to/install.rst.
oder = "oder"
ilda = "ilda"
tilda = "tilda"
