[project]
name = "neofoam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Henning Scheufler", email = "henning.scheufler@web.de" }
]
requires-python = ">=3.9"

dependencies = [
    "pybFoam>=0.4.3",
    "typer",
    "pydantic>=2.0.0",
    "networkx>=3.0",
    "matplotlib>=3.0.0",
    "pyvis>=0.3.2",
    "neon_pde",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "pytest-xdist",
    "pydantic-settings",
    "black",
    "flake8",
    "isort",
    "mypy",
    "pandas>=2.0.0",
    "poethepoet>=0.37.0",
    "ruff>=0.14.2",
    "mypy",
    "pre-commit",
    "types-PyYAML",
    # build deps needed in env when no-build-isolation is enabled
    "scikit-build-core[pyproject]>=0.11.0",
    "nanobind>=2.12.0",
]
docs = [
    "sphinx>=4.0",
    "myst-parser",
    "sphinx-sitemap",
    "furo",
    "sphinxcontrib-mermaid",
    "sphinx-togglebutton>=0.3.2",
    "breathe",
    "pyvista>=0.43",
    "sphinx-gallery>=0.16",
    # Interactive .vtksz scenes embedded under each pyvista figure
    # via DynamicScraper; trame materialises the vtk.js viewer and
    # nest_asyncio2 lets pyvista launch the in-memory trame server
    # synchronously from inside `Plotter.export_vtksz`. sphinx-design
    # provides the tab-set / tab-item directives DynamicScraper emits
    # to switch between the static PNG and the interactive viewer.
    "trame",
    "trame-vtk",
    "trame-vuetify",
    "nest_asyncio2",
    "sphinx-design",
    # GIF animations from pl.open_gif() / pl.write_frame() in
    # tutorials 02 and 03.
    "imageio",
]
all = [
    "neofoam[dev,docs]",
]

[project.scripts]
neofoam = "neofoam.cli.app:app"

[build-system]
requires = [
    "scikit-build-core[pyproject]>=0.11.0",
    "nanobind>=2.12.0",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.version = ">=3.22"
cmake.args = ["--preset=python-bindings"]
build.verbose = true
build-dir = "_skbuild"
editable.mode = "redirect"
editable.verbose = true
editable.rebuild = false

[tool.scikit-build.cmake.define]
NEOFOAM_BUILD_PYTHON_BINDINGS = "ON"

[tool.uv.sources]
neon_pde = { path = "src/NeoN", editable = true }
#pybFoam = { path = "../pybFoam", editable = true }

[tool.uv]
no-build-isolation-package = ["neofoam"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["build/", "dist/"]

[tool.ruff.lint]
select = ["E","F","I"]  # enable isort (I) + basic lint

# optional per-rule ignores
ignore = []

# isort options (import sorting)
[tool.ruff.lint.isort]
known-first-party = ["neofoam"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra --showlocals"
testpaths = [
    "test"
]

[tool.mypy]
plugins = ["pydantic.mypy"]
files = ["src", "test"]
mypy_path = ["src", "test"]
strict = true

exclude = [
  "src/NeoN",
]

# If other code imports src/NeoN and you want mypy to never follow into it:
[[tool.mypy.overrides]]
module = ["NeoN", "NeoN.*", "pybFoam", "pybFoam.*", "neon", "neon.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.poe.tasks]
test = "pytest"
lint = "ruff check"
format = "ruff format src test"
type_check = "mypy"
# sphinx-gallery (configured in doc/conf.py) executes each
# examples/tutorials/example_*.py at build time and emits the rendered
# tutorial pages under doc/auto_tutorials/. Caching via .py.md5 makes
# re-builds of unchanged scripts near-instant. Needs OpenFOAM sourced
# (WM_PROJECT_DIR set) and pyvista headless (xvfb on Linux).
build_docs = "sphinx-build -b html doc doc/_build"
# Serve the built docs over a local HTTP server. Required for the
# interactive pyvista viewers — they fetch `.vtksz` files via JS,
# which browsers block under the ``file://`` protocol.
serve_docs = { shell = "cd doc/_build && python -m http.server 8000" }
view_docs = { shell = "python -m webbrowser -t http://localhost:8000/index.html" }
