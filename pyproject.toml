[project]
name = "foamadapter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Henning Scheufler", email = "henning.scheufler@web.de" }
]
requires-python = ">=3.9"

dependencies = [
    "pybFoam>=0.1.8",
    "typer",
    "pydantic>=2.0.0",
    "networkx>=3.0",
    "matplotlib>=3.0.0",
    "pyvis>=0.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "pytest-xdist",
    "black",
    "flake8",
    "isort",
    "mypy",
    "pandas>=2.0.0",
    "poethepoet>=0.37.0",
    "ruff>=0.14.2",
    "mypy",
    "pre-commit",
    "types-PyYAML",
]
docs = [
    "sphinx>=4.0",
    "myst-parser",
    "sphinx-sitemap",
    "furo",
    "sphinxcontrib-mermaid",
    "sphinx-togglebutton>=0.3.2",
    "breathe",
]
all = [
    "foamadapter[dev,docs]",
]

[project.scripts]
foamadapter = "foamadapter.cli.app:app"

[build-system]
requires = ["uv_build>=0.8.6,<0.9.0"]
build-backend = "uv_build"


[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["build/", "dist/"]

[tool.ruff.lint]
select = ["E","F","I"]  # enable isort (I) + basic lint

# optional per-rule ignores
ignore = []

# isort options (import sorting)
[tool.ruff.lint.isort]
known-first-party = ["foamadapter"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra --showlocals"
testpaths = [
    "test"
]

[tool.mypy]
plugins = ["pydantic.mypy"]
mypy_path = ["src"]
files = ["src"]
strict = true
no_site_packages = true          # Don't check installed packages (avoids pybFoam stub issues)
follow_imports = "skip"          # Don't follow third-party imports
warn_unused_ignores = false      # Don't warn about unused type: ignore
# Disable strict mode checks that cause issues with dynamic patterns
disallow_subclassing_any = false
disallow_untyped_defs = false
disallow_untyped_decorators = false  # Decorators use Any type for flexibility

exclude = ["src/NeoN", "test/", ".venv/"]

# Third-party libraries without stubs
[[tool.mypy.overrides]]
module = ["pydantic", "pydantic.*", "pyvis.*", "yaml", "networkx", "networkx.*", "typer", "typer.*", "pyvis", "pyvis.network"]
ignore_missing_imports = true

# pybFoam doesn't have proper type stubs
[[tool.mypy.overrides]]
module = ["pybFoam", "pybFoam.*"]
ignore_missing_imports = true
ignore_errors = true


[tool.poe.tasks]
test = "pytest"
lint = "ruff check"
format = "ruff format"
type_check = "mypy"
build_docs = "sphinx-build -b html doc doc/_build"
view_docs = { shell = "python -m webbrowser -t doc/_build/index.html" }
