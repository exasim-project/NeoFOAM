[project]
name = "neofoam"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Henning Scheufler", email = "henning.scheufler@web.de" },
    { name = "Gregor Olenik", email = "gregor.olenik@tum.de" },
    { name = "Chih-Ta Wang", email = "chihta.wang@tum.de" },
    { name = "Dheeraj Raghunathan", email = "dheeraj.raghunathan@tum.de" }
]
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "matplotlib",
    "foamlib",
    "pybFoam>=0.5.1",
    "typer",
    "pydantic>=2.0.0",
    "networkx>=3.0",
    "matplotlib>=3.0.0",
    "pyvis>=0.3.2",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "pytest-xdist",
    "pydantic-settings",
    "black",
    "flake8",
    "isort",
    "mypy",
    "pandas>=2.0.0",
    "poethepoet>=0.37.0",
    "ruff>=0.14.2",
    "mypy",
    "pre-commit",
    "types-PyYAML",
    # build deps needed in env when no-build-isolation is enabled
    "scikit-build-core[pyproject]>=0.11.0",
    "nanobind>=2.9.0",
]
docs = [
    "sphinx>=4.0",
    "myst-parser",
    "sphinx-sitemap",
    "furo",
    "sphinxcontrib-mermaid",
    "sphinx-togglebutton>=0.3.2",
    "breathe",
    "pyvista>=0.43",
    "sphinx-gallery>=0.16",
    # Interactive .vtksz scenes embedded under each pyvista figure
    # via DynamicScraper; trame materialises the vtk.js viewer and
    # nest_asyncio2 lets pyvista launch the in-memory trame server
    # synchronously from inside `Plotter.export_vtksz`. sphinx-design
    # provides the tab-set / tab-item directives DynamicScraper emits
    # to switch between the static PNG and the interactive viewer.
    "trame",
    "trame-vtk",
    "trame-vuetify",
    "nest_asyncio2",
    "sphinx-design",
    # GIF animations from pl.open_gif() / pl.write_frame() in
    # tutorials 02 and 03.
    "imageio",
    # The telemetry how-to (example_trace_solver_performance) traces a
    # real solver run at gallery-build time.
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]
agent = [
    # OpenAI-compatible client (local Ollama, OpenAI-style endpoints) plus the
    # Anthropic backend for hosted Claude models (e.g. Haiku).
    "pydantic-ai-slim[openai,anthropic]>=0.0.40",
]
mcp = [
    # MCP server: FastMCP v3 protocol layer (pulls the `mcp` SDK transitively)
    # + FastAPI/uvicorn web server. httpx backs the FastAPI TestClient / MCP client.
    "fastmcp>=3,<4",
    "fastapi",
    "uvicorn",
    "httpx",
]
telemetry = [
    # Opt-in performance tracing (neofoam.telemetry); the shim itself works
    # without these — only activating telemetry requires the SDK.
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    # neofoam.telemetry.report renders the emitted trace: the Chrome/Perfetto
    # export is dependency-free, the summary bar chart needs matplotlib.
    "matplotlib>=3.5",
]
blockamr = [
    # Runtime deps of the vendored `blockamr` engine (built from src/NeoN
    # when NeoN_WITH_AMREX is ON below). The AMReX MLMG solve is C++, but the DSL
    # stencil kernels are JAX + Triton/Pallas and run on the GPU — a CUDA jaxlib
    # is required (there is no CPU lowering for the Pallas kernels).
    #
    # jax is pinned to 0.10.2 (NOT the reference 0.9.1): jaxlib 0.9.1 serialises
    # Pallas kernels to on-disk Triton IR it cannot parse back, so the second
    # dispatch of a kernel aborts nondeterministically with "Failed to parse
    # Triton module: expected mlir::triton::CacheModifierAttr, but got:
    # array<i32>". 0.10.2 fixes the round-trip (same triton 3.6.0). Keep the
    # cu13 wheels coherent — do not let cu12 jax plugins co-install.
    "jax[cuda13]==0.10.2",
    "triton==3.6.0",
    "equinox==0.13.6",
]
all = [
    "neofoam[dev,docs,agent,mcp,telemetry,blockamr]",
]

[project.scripts]
neofoam = "neofoam.cli.app:app"

[build-system]
requires = [
    "scikit-build-core[pyproject]>=0.11.0",
    "nanobind>=2.9.0",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.version = ">=3.22"
cmake.args = ["--preset=python-bindings"]
build.verbose = true
build-dir = "_skbuild"
editable.mode = "redirect"
editable.verbose = true
editable.rebuild = false

[tool.scikit-build.cmake.define]
NEOFOAM_BUILD_PYTHON_BINDINGS = "ON"
# Build the block-structured AMReX engine + its bindings (blockamr) as part
# of the same wheel: AMReX is fetched from source via CPM under SKBUILD, and
# _blockamr.so + blockamr/*.py install alongside _neon. This makes
# `pip install .[all] -v` provide the full incompressibleFluidBlockAMR stack in
# one interpreter.
#
# AMReX uses the CUDA backend (derived from NeoN's Kokkos CUDA): the blockamr DSL
# stencil kernels are JAX+Triton/Pallas and run on the GPU, so the AMReX
# MultiFabs must live in device memory for a same-device AMReX<->JAX dlpack
# handoff (a CPU AMReX build makes Pallas try a nonexistent CPU lowering). The
# early enable_language(CUDA) in NeoN/CMakeLists keeps the -D defines from being
# dropped when Kokkos swaps the compiler mid-configure.
NeoN_WITH_AMREX = "ON"
# NeoN is left to build exactly as it does standalone: its CUDA auto-detect
# (cmake/AutoEnableDevice.cmake) turns on the Kokkos CUDA backend when a CUDA
# compiler is present, so NeoN keeps all of its executor backends
# (Serial/OpenMP/CUDA). AMReX inherits that same CUDA backend (NeoN derives
# NeoN_AMREX_GPU_BACKEND from Kokkos_ENABLE_CUDA), which is what blockamr needs
# for the device-memory JAX/Triton dlpack handoff — so enabling AMReX does not
# change NeoN's own build. The only combined-build-specific tweak lives in
# neofoam's top-level CMakeLists (an early enable_language(CUDA)) so neofoam's
# own NeoFOAM lib sees CUDA compile-features; that is a neofoam concern and does
# not touch NeoN.

[tool.uv]
no-build-isolation-package = ["neofoam"]

[tool.uv.sources]
pybFoam = { path = "/home/henning/libsAndApps/pybFoam", editable = true }

[tool.ruff]
line-length = 100
target-version = "py310"
include = ["pyproject.toml", "src/**/*.py", "test/**/*.py"]
extend-exclude = ["build/", "dist/", "src/NeoN"]

[tool.ruff.lint]
select = ["E","F","I"]  # enable isort (I) + basic lint
extend-select = ["PLC0415"]

# optional per-rule ignores
ignore = []

# isort options (import sorting)
[tool.ruff.lint.isort]
known-first-party = ["neofoam"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra --showlocals"
testpaths = [
    "test"
]
markers = [
    "slow: mesh-building tests (blockMesh/snappyHexMesh + checkMesh); deselect with -m 'not slow'",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
files = ["src"]          # your two roots
mypy_path = ["src"]              # so imports from src resolve
strict = true                    # optional but recommended

# Exclude src/Neon and everything beneath it
# (mypy applies this regex to the normalized file path)
exclude = [
  "src/NeoN",
]

# If other code imports src/NeoN and you want mypy to never follow into it:
[[tool.mypy.overrides]]
module = ["NeoN", "NeoN.*", "pybFoam", "pybFoam.*", "neon", "neon.*", "blockamr", "blockamr.*"]
ignore_missing_imports = true
follow_imports = "skip"

# opentelemetry is the optional [telemetry] extra — absent in most envs.
[[tool.mypy.overrides]]
module = ["opentelemetry", "opentelemetry.*"]
ignore_missing_imports = true

[tool.poe.executor]
type = "simple"

[tool.poe.tasks]
test = "pytest"
lint = "ruff check"
format = "ruff format src test"
type_check = "mypy"
build_docs = "sphinx-build -b html doc doc/_build"
serve_docs = { shell = "cd doc/_build && python -m http.server 8000" }
view_docs = { shell = "python -m webbrowser -t http://localhost:8000/index.html" }
