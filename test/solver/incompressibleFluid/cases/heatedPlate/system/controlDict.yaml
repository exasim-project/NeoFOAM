# Flow over a heated plate (first three time steps): the times every region steps on.
# Each region is a case of its own: fluid/ (incompressibleFluid, Boussinesq),
# solid/ (heatConductionNeoN, the plate).
endTime: 0.03
deltaT: 0.01
writeControl: timeStep
writeInterval: 3
regionSolvers:
  fluid: incompressibleFluid
  solid: heatConductionNeoN
