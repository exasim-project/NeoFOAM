# coupledBlocks with one loop around each region's whole time step: no wraps.
exchanges:
  - name: interface
    ports: {left: interface, right: interface}
    mapping: nearest-neighbor
couplings:
  - name: coupling
    scheme: parallel
    maxIterations: 3
    exchanges:
      - {name: interface, acceleration: {type: aitken, relaxation: 0.5}}
    convergence:
      - {type: relative, data: T, limit: 1.0e-10}
      - {type: relative, data: q, limit: 1.0e-10}
