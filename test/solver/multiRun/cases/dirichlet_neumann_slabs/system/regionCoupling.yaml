# Dirichlet-Neumann: left sends its wall temperature, right its wall heat flux.
# Serial: the node wraps each region's solve_T, so the time step stays outside it.
exchanges:
  - name: interface
    sides: {left: right, right: left}
    mapping: nearest-neighbor
couplings:
  - name: coupling
    scheme: serial
    maxIterations: 100
    exchanges:
      - {name: interface, acceleration: {type: aitken, relaxation: 0.5}}
    convergence:
      - {type: relative, data: T, limit: 1.0e-12}
      - {type: relative, data: q, limit: 1.0e-12}
    wraps:
      left: {operations: [solve_T]}
      right: {operations: [solve_T]}
