# Dirichlet-Neumann: left sends its wall temperature, right its wall heat flux.
exchanges:
  - name: interface
    sides: {left: right, right: left}
    mapping: nearest-neighbor
scheme: serial
acceleration:
  type: aitken
  relaxation: 0.5
convergence:
  - type: relative
    data: T
    limit: 1.0e-12
maxIterations: 100
