# Laid over cases/affine_pair: the serial node without wraps holds the time step.
exchanges:
  - ports: {a: interface, b: interface}
couplings:
  - name: coupling
    scheme: serial
    maxIterations: 50
    exchanges:
      - {name: a-b, acceleration: {type: constant, relaxation: 1.0}}
    convergence:
      - {type: relative, data: x, limit: 1.0e-6}
