# Laid over cases/affine_pair: parallel (Jacobi), no relaxation.
exchanges:
  - sides: {a: interface, b: interface}
couplings:
  - name: coupling
    scheme: parallel
    maxIterations: 50
    exchanges:
      - {name: a-b, acceleration: {type: constant, relaxation: 1.0}}
    convergence:
      - {type: relative, data: x, limit: 1.0e-6}
    wraps:
      a: {operations: [solve_x]}
      b: {operations: [solve_x]}
