# Laid over cases/coupled_slabs: the mapping and acceleration of fake_plugin.py, with a typo in an option.
exchanges:
  - name: interface
    sides: {left: right, right: left}
    mapping: {type: fake-rbf, radius: 0.25}
couplings:
  - name: coupling
    scheme: parallel
    exchanges:
      - {name: interface, acceleration: {type: fake-iqn, relaxation: 0.7, column: 3}}
    convergence:
      - {type: relative, data: T, limit: 1.0e-12}
