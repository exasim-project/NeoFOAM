# One table and two in-situ entries of the test's ``recorder`` type, on two cadences.
tables:
  - name: every_step
    source: {type: internal, field: p}
    pipeline: [{type: volIntegrate, name: every_step}]

insitu:
  - name: every_step_view
    type: recorder

  - name: every_second_step_view
    type: recorder
    write_control: {write_control_type: timeStep, interval: 2}
    label: coarse
