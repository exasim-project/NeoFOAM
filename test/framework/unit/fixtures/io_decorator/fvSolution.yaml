PIMPLE:
  nOuterCorrectors: 3
  nCorrectors: 2
  nNonOrthogonalCorrectors: 0
  momentumPredictor: true

solvers:
  p:
    solver: PCG
    preconditioner: DIC
    tolerance: 1.0e-6
    relTol: 0.01
  
  U:
    solver: PBiCGStab
    preconditioner: DILU
    tolerance: 1.0e-5
    relTol: 0.1
  
  T:
    solver: smoothSolver
    smoother: symGaussSeidel
    tolerance: 1.0e-7
    relTol: 0.0
