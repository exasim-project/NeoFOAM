# Two regions over cases/box: the whole mesh, then the two left-hand cell
# columns again. Where they overlap the later one has to win.
regions:
  - region: {type: box, min: [0, 0, -1], max: [1, 1, 1]}
    values: {alpha.water: 0.25}
  - region: {type: box, min: [0, 0, -1], max: [0.5, 1, 1]}
    values: {alpha.water: 1}
