# Expected values for the LES / Smagorinsky case. Smagorinsky is NOT registered in
# the turbulence family: the native NeoN path has no closure for it and raises, while
# the pybFoam path builds it from OpenFOAM's own run-time selection table.
config:                       # cross-checked against the real turbulenceProperties read
  simulationType: LES
  RAS: null
  LES:                        # full sub-dictionary, compared wholesale
    LESModel: Smagorinsky
    turbulence: true
    delta: cubeRootVol
selection:
  model_name: Smagorinsky
  resolves_to: unregistered    # native (registered) | unregistered | wrong_family
