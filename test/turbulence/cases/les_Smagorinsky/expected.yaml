# Expected values for the LES / Smagorinsky case. Smagorinsky is NOT registered
# in the turbulence family, so selection raises (the post-merge world requires a
# registered model — the generic "any OpenFOAM model" wrapper is gone).
config:                       # cross-checked against the real turbulenceProperties read
  simulationType: LES
  RAS: null
  LES:                        # full sub-dictionary, compared wholesale
    LESModel: Smagorinsky
    turbulence: true
    delta: cubeRootVol
selection:
  model_name: Smagorinsky
  resolves_to: unregistered    # native (registered) | unregistered
