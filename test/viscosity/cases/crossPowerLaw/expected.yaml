# Expected values for the CrossPowerLaw case. No native NeoFOAM model is
# registered for it, so selection resolves to the OpenFOAM fallback adapter.
config:                       # cross-checked against the real transportProperties read
  transportModel: CrossPowerLaw
  nu: null                    # coefficients live in their own sub-dictionary
selection:
  model_name: CrossPowerLaw
  resolves_to: fallback       # native | fallback
